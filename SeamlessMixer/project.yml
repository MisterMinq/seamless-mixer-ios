# XcodeGen spec for the SeamlessMixer app target — Andy has no Mac, so this
# YAML file *is* the Xcode project (per CLAUDE.md's "Build & Verification
# Pipeline — No Mac"). Codemagic runs `xcodegen generate` on its cloud Mac to
# turn this into a real .xcodeproj; nobody ever opens Xcode's New Project
# wizard by hand. Not verified against a live `xcodegen` install — this
# environment can't run it — so if Codemagic's build log shows a schema
# error, check XcodeGen's own docs (github.com/yonaskolb/XcodeGen) for a
# renamed key; the intent below should still be right even if a keyword
# has drifted.
#
# Expected layout once this is copied into the seamless-mixer-ios repo:
#   seamless-mixer-ios/
#     Package.swift          <- PlaylistCore (repo root, confirmed 2026-08-07)
#     Sources/ Tests/         <- PlaylistCore
#     SeamlessMixer/
#       project.yml           <- this file
#       App/                  <- SwiftUI sources below
# i.e. this file sits one level below the package root, hence `path: ../`
# in the `packages:` section.

name: SeamlessMixer
options:
  bundleIdPrefix: com.misterminq
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  PlaylistCore:
    path: ../

targets:
  SeamlessMixer:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
    dependencies:
      - package: PlaylistCore
        product: PlaylistCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misterminq.SeamlessMixer
        # CODE_SIGNING_ALLOWED: NO used to live here, on the reasoning that
        # CI has no distribution certs and a Simulator build doesn't need
        # signing. Removed 2026-08-12: this file is shared by BOTH the
        # Simulator workflow (seamless-mixer-app) and the real-device
        # TestFlight workflow (seamless-mixer-testflight) added since then.
        # The Simulator workflow already passes CODE_SIGNING_ALLOWED=NO on
        # its own xcodebuild command line (see codemagic.yaml), so this
        # project-level setting was always redundant there -- but for
        # TestFlight, nothing overrode it, so it hard-disabled signing
        # project-wide even after `xcode-project use-profiles` correctly
        # fetched and applied a real certificate/profile. Confirmed via a
        # real build log: the archive itself succeeded, but `codesign`
        # reported "code object is not signed at all" right after, which
        # then broke `xcode-project build-ipa`'s export step (it reads
        # entitlements off the signed app to build the export options
        # plist, and found nothing to read). No CODE_SIGNING_ALLOWED
        # setting belongs at the project level now that both a signed and
        # an unsigned workflow share this spec -- each workflow controls it
        # explicitly via its own command line instead.
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.10"
        ENABLE_PREVIEWS: YES
        # Build 8 (commit 3e03d3b) was the first fully successful TestFlight
        # upload -- build 9 (commit 7d01044) then failed with a completely
        # different, expected error: "The bundle version must be higher than
        # the previously uploaded version: '1'" -- CURRENT_PROJECT_VERSION
        # (-> CFBundleVersion) had no explicit setting anywhere, so every
        # archive defaulted to the same static "1", and Apple requires each
        # TestFlight upload to have a strictly higher build number than the
        # last, even for the same marketing version. Fixed per Codemagic's
        # own documented approach (docs.codemagic.io/knowledge-codemagic/
        # build-versioning): reference their auto-exported $(BUILD_NUMBER)
        # env var directly as a build setting, so Xcode resolves the actual
        # value at build time -- no extra script step or App Store Connect
        # API call needed. Deliberately BUILD_NUMBER (count of runs of THIS
        # workflow, seamless-mixer-testflight, specifically) over the
        # alternative PROJECT_BUILD_NUMBER (count across every workflow in
        # the app, including the unrelated seamless-mixer-app Simulator
        # workflow) -- ties the version number to actual TestFlight
        # submission attempts, not incidental Simulator pushes.
        CURRENT_PROJECT_VERSION: $(BUILD_NUMBER)
        # Build 12 (commit f7d2f3d) got CFBundleVersion right (showed "12",
        # matching BUILD_NUMBER) but then failed a different way: "The main
        # Info.plist did not contain 'CFBundleShortVersionString'." Cause:
        # `MARKETING_VERSION` was never defined as a build setting anywhere
        # in this project (confirmed absent from a real -showBuildSettings
        # dump) — so the $(MARKETING_VERSION) placeholder just added to
        # Info.plist's CFBundleShortVersionString resolved to nothing, and
        # Xcode dropped the key entirely rather than writing an empty
        # string. Per Apple/Codemagic's own convention (docs.codemagic.io/
        # knowledge-codemagic/build-versioning): CFBundleShortVersionString
        # is the public "1.0"-style release version and should be static,
        # manually bumped per real release — unlike CFBundleVersion, it's
        # deliberately NOT tied to BUILD_NUMBER. Set as a real, fixed value
        # here so the placeholder has something to resolve to; bump this by
        # hand when an actual versioned release happens, not automatically.
        MARKETING_VERSION: "1.0"
    info:
      path: App/Info.plist
      properties:
        # Working display name, set 2026-08-12 per Andy: "call it
        # SeamlessDJ for now and change name later" — this is CFBundleDisplayName
        # only (what shows under the icon on-device and in TestFlight), a
        # deliberately narrow change. NOT renamed: the Xcode target/project
        # name (still "SeamlessMixer" everywhere in this file), the bundle
        # identifier (still com.misterminq.SeamlessMixer — already
        # registered with Apple and Codemagic's signing setup; renaming it
        # would mean a new App ID, a new App Store Connect app record, and
        # redoing the whole 0.18.3-0.18.9 signing setup from scratch), and
        # the App Store Connect app record's own "Name" metadata field
        # (separate from CFBundleDisplayName, set once when Andy created
        # the app record — still says "SeamlessMixer" there, change it in
        # App Store Connect directly if/when the name is finalized). A full
        # rename across all of these is real, separate work — flagged here,
        # not done piecemeal.
        CFBundleDisplayName: SeamlessDJ
        # Builds 8-11 all uploaded with "Version code: 1" no matter what —
        # neither project.yml's CURRENT_PROJECT_VERSION: $(BUILD_NUMBER)
        # (0.18.11) nor codemagic.yaml's --archive-xcargs override (0.18.12)
        # had any effect, despite being two structurally different
        # mechanisms. Root cause: XcodeGen's `info:` block writes a real,
        # literal Info.plist FILE at generate time. Since CFBundleVersion/
        # CFBundleShortVersionString were never listed here explicitly,
        # XcodeGen filled in its own hardcoded default ("1"/"1.0") as
        # static text, not as a $(VAR)-style placeholder -- so there was
        # never anything for either build-setting override to substitute
        # into, regardless of which one "won." Fix: explicitly write the
        # placeholder strings ourselves so Xcode's own Info.plist build-
        # setting expansion (INFOPLIST_EXPAND_BUILD_SETTINGS = YES,
        # confirmed on in a real build's -showBuildSettings dump) has an
        # actual $(CURRENT_PROJECT_VERSION)/$(MARKETING_VERSION) token to
        # find and replace at build time.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        # Background audio session, per the confirmed mixing-engine design
        # ("Background playback" in CLAUDE.md) — required from day one so
        # later AVAudioEngine work doesn't need a separate Info.plist change.
        UIBackgroundModes:
          - audio
        # MediaPlayer/MPMediaQuery access for source selection (ADR-7) —
        # not used by this first screen yet, declared now so the prompt
        # text is decided deliberately rather than bolted on later.
        NSAppleMusicUsageDescription: "Seamless Mixer reads your music library so it can build seamless playlists from songs you already own."
        # Export compliance declaration, added 2026-08-12 after a real
        # TestFlight submission failure: "422: The build is missing export
        # compliance." Apple requires every build to declare whether it uses
        # non-exempt encryption before it can go to beta review — without
        # this key, Codemagic's automated `submit_to_testflight: true` has
        # no way to answer that question (it's normally a manual per-build
        # toggle on the App Store Connect website), so the submission call
        # itself fails. This app has no server component at all (per ADR-2,
        # "on-device, live, at playback time") and doesn't implement any
        # custom cryptography — it only uses whatever standard HTTPS/TLS the
        # OS and its frameworks (MediaPlayer, AVFoundation) provide, which
        # is Apple's own definition of exempt. `false` here means "does NOT
        # use non-exempt encryption," which answers Apple's compliance
        # question at build time and skips the manual per-build web-form
        # step entirely, matching this app's actual behavior.
        ITSAppUsesNonExemptEncryption: false
